name: couchbase

services:
  couchbase-server:
    image: couchbase:community-7.6.2
    container_name: couchbase-server
    ports:
      - "8091-8096:8091-8096"
      - "11210:11210"
    volumes:
      - couchbase_data:/opt/couchbase/var
    networks:
      - couchbase_net
    restart: unless-stopped

  couchbase-init:
    image: couchbase:community-7.6.2
    container_name: couchbase-init
    depends_on:
      - couchbase-server
    environment:
      COUCHBASE_ADMIN_USER: ${COUCHBASE_ADMIN_USER}
      COUCHBASE_ADMIN_PASSWORD: ${COUCHBASE_ADMIN_PASSWORD}
      COUCHBASE_SYNC_USER: ${COUCHBASE_SYNC_USER}
      COUCHBASE_SYNC_PASSWORD: ${COUCHBASE_SYNC_PASSWORD}
    volumes:
      - ./init-couchbase.sh:/init-couchbase.sh
    entrypoint: ["/bin/bash", "/init-couchbase.sh"]
    networks:
      - couchbase_net

  sync-gateway:
    image: couchbase/sync-gateway:3.1.0-community
    container_name: sync-gateway
    depends_on:
      couchbase-init:
        condition: service_completed_successfully
    ports:
      - "4984:4984"
      - "4985:4985"
    environment:
      COUCHBASE_SYNC_USER: ${COUCHBASE_SYNC_USER}
      COUCHBASE_SYNC_PASSWORD: ${COUCHBASE_SYNC_PASSWORD}
    volumes:
      - ./sync-gateway-config.json:/etc/sync-gateway/config.json
    command: ["/etc/sync-gateway/config.json"]
    networks:
      - couchbase_net
    restart: unless-stopped

volumes:
  couchbase_data:
    name: couchbase_data

networks:
  couchbase_net:
    name: couchbase_net
    driver: bridge